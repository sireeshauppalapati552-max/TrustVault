{% extends "base.html" %}{% block content %}<section class="card narrow"><p class="eyebrow">NEW DOCUMENT</p><h1>Upload a document</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf_token}}">
<label>Document title</label><input name="title" maxlength="120" required placeholder="e.g. Vendor agreement">
<label>Category</label><input name="category" maxlength="60" value="General" required>
<label>Choose file</label><input type="file" name="file" required><p class="muted">Allowed: PDF, TXT, PNG, JPG, DOCX, XLSX · Maximum 10 MB</p><button class="primary">Upload securely</button></form></section>{% endblock %}
